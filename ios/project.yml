# Reserve-optie. Het project in Rondo.xcodeproj is met de hand geschreven
# (objectVersion 77, gesynchroniseerde mappen). Opent dat niet in jouw
# Xcode-versie, dan genereer je het hiermee opnieuw:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# XcodeGen schrijft een klassiek project (expliciete bestandslijsten) met
# dezelfde twee targets, dezelfde bundle-id's en dezelfde Info.plists.
name: Rondo
options:
  bundleIdPrefix: nl.bbruijn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: nl

targets:
  Rondo:
    type: application
    platform: iOS
    sources:
      - path: Rondo/Shared
      - path: Rondo/iOS
    dependencies:
      - target: Rondo Watch App
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bbruijn.rondo
        PRODUCT_NAME: Rondo
        INFOPLIST_FILE: Info-iOS.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"

  Rondo Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Rondo/Shared
      - path: Rondo/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bbruijn.rondo.watchkitapp
        PRODUCT_NAME: Rondo Watch App
        INFOPLIST_FILE: Info-Watch.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        ENABLE_PREVIEWS: "YES"

  RondoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RondoTests
    dependencies:
      - target: Rondo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bbruijn.rondo.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rondo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rondo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Rondo:
    build:
      targets:
        Rondo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RondoTests
  Rondo Watch App:
    build:
      targets:
        Rondo Watch App: all
    run:
      config: Debug
